<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="545" viewBox="0 0 1400 545" role="img" aria-labelledby="title desc">
<title id="title">Weekly report archive workflow</title>
<desc id="desc">A visual flow showing the email trigger, report filtering, date or week processing, archive folders, existing-file check and create or replace outcomes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#14213a"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020817" flood-opacity=".3"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f91b4"/></marker>
 <marker id="branchArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#70d9b5"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="545" rx="20" fill="url(#bg)"/>
<rect x="28" y="25" width="5" height="52" rx="2" fill="#70d9b5"/>
<text x="48" y="48" fill="#75d9bc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">WEEKLY / AUTOMATION</text>
<text x="48" y="83" fill="#f1f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Weekly Compliance Report Archive</text>
<text x="48" y="109" fill="#aec3d4" font-family="Segoe UI, Arial, sans-serif" font-size="16">A message becomes a dated, searchable file — automatically.</text><rect x="48" y="150" width="182" height="154" rx="16" fill="#192a43" stroke="#3a506b" stroke-width="1.6" filter="url(#shadow)"/>
 <rect x="62" y="164" width="39" height="31" rx="9" fill="#1f4162"/>
 <text x="81.5" y="186" fill="#95cbf5" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">01</text>
 <text x="63" y="224" fill="#f2f7fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">EMAIL ARRIVES</text>
 <text x="63" y="256" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Mailbox receives</text>
 <text x="63" y="277" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">weekly attachment</text><path d="M237 227 H256" stroke="#5f91b4" stroke-width="2.7" fill="none" marker-end="url(#arrow)"/><rect x="266" y="150" width="182" height="154" rx="16" fill="#192a43" stroke="#3a506b" stroke-width="1.6" filter="url(#shadow)"/>
 <rect x="280" y="164" width="39" height="31" rx="9" fill="#1f4162"/>
 <text x="299.5" y="186" fill="#95cbf5" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">02</text>
 <text x="281" y="224" fill="#f2f7fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">WEEK DATES</text>
 <text x="281" y="256" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Determine start</text>
 <text x="281" y="277" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">and end of week</text><path d="M455 227 H474" stroke="#5f91b4" stroke-width="2.7" fill="none" marker-end="url(#arrow)"/><rect x="484" y="150" width="182" height="154" rx="16" fill="#192a43" stroke="#3a506b" stroke-width="1.6" filter="url(#shadow)"/>
 <rect x="498" y="164" width="39" height="31" rx="9" fill="#1f4162"/>
 <text x="517.5" y="186" fill="#95cbf5" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">03</text>
 <text x="499" y="224" fill="#f2f7fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">FILTER FILES</text>
 <text x="499" y="256" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Select .xlsx only</text>
 <text x="499" y="277" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">ignore others</text><path d="M673 227 H692" stroke="#5f91b4" stroke-width="2.7" fill="none" marker-end="url(#arrow)"/><rect x="702" y="150" width="182" height="154" rx="16" fill="#192a43" stroke="#3a506b" stroke-width="1.6" filter="url(#shadow)"/>
 <rect x="716" y="164" width="39" height="31" rx="9" fill="#1f4162"/>
 <text x="735.5" y="186" fill="#95cbf5" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">04</text>
 <text x="717" y="224" fill="#f2f7fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">NAME REPORT</text>
 <text x="717" y="256" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Include both dates</text>
 <text x="717" y="277" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">in output name</text><path d="M891 227 H910" stroke="#5f91b4" stroke-width="2.7" fill="none" marker-end="url(#arrow)"/><rect x="920" y="150" width="182" height="154" rx="16" fill="#192a43" stroke="#3a506b" stroke-width="1.6" filter="url(#shadow)"/>
 <rect x="934" y="164" width="39" height="31" rx="9" fill="#1f4162"/>
 <text x="953.5" y="186" fill="#95cbf5" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">05</text>
 <text x="935" y="224" fill="#f2f7fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">MAKE FOLDERS</text>
 <text x="935" y="256" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Year and month</text>
 <text x="935" y="277" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">from week start</text><path d="M1109 227 H1128" stroke="#5f91b4" stroke-width="2.7" fill="none" marker-end="url(#arrow)"/><rect x="1138" y="150" width="182" height="154" rx="16" fill="#192a43" stroke="#3a506b" stroke-width="1.6" filter="url(#shadow)"/>
 <rect x="1152" y="164" width="39" height="31" rx="9" fill="#26534f"/>
 <text x="1171.5" y="186" fill="#8af1d0" font-size="15" font-weight="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">06</text>
 <text x="1153" y="224" fill="#f2f7fd" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">FILE CHECK</text>
 <text x="1153" y="256" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">Look for matching</text>
 <text x="1153" y="277" fill="#acc1d6" font-family="Segoe UI, Arial, sans-serif" font-size="14">archive filename</text><path d="M357 304 V359" fill="none" stroke="#7f97ad" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="51" y="370" width="550" height="69" rx="13" fill="#202d40" stroke="#526274"/>
<text x="72" y="399" font-family="Segoe UI, Arial, sans-serif" fill="#efc77f" font-size="17" font-weight="700">NO MATCHING SPREADSHEET?</text>
<text x="72" y="425" font-family="Segoe UI, Arial, sans-serif" fill="#b9c8d8" font-size="15">Stop without creating empty archive folders.</text>
<path d="M1229 304 V328 H1021 V368" stroke="#70d9b5" stroke-width="2.5" fill="none" marker-end="url(#branchArrow)"/>
<path d="M1229 328 H1255 V368" stroke="#70d9b5" stroke-width="2.5" fill="none" marker-end="url(#branchArrow)"/>
<rect x="900" y="370" width="235" height="69" rx="13" fill="#163e3d" stroke="#3b9785"/>
<text x="920" y="400" font-family="Segoe UI, Arial, sans-serif" fill="#a2f5d9" font-size="17" font-weight="700">REPLACE FILE</text>
<text x="920" y="425" font-family="Segoe UI, Arial, sans-serif" fill="#b6d7cf" font-size="14">If name exists and changed</text>
<rect x="1150" y="370" width="201" height="69" rx="13" fill="#1e3d57" stroke="#528eb3"/>
<text x="1168" y="400" font-family="Segoe UI, Arial, sans-serif" fill="#b5dcfa" font-size="17" font-weight="700">CREATE FILE</text>
<text x="1168" y="425" font-family="Segoe UI, Arial, sans-serif" fill="#bdd1e2" font-size="14">If filename is new</text>
<path d="M50 478 H1350" stroke="#34485f"/>
<text x="50" y="507" font-family="Segoe UI, Arial, sans-serif" fill="#96adc5" font-size="15">ARCHIVE EXAMPLE</text>
<text x="226" y="507" font-family="Consolas, Menlo, monospace" fill="#e5f4ff" font-size="15">weekly/2025/12/20251229_20260104_weekly.xlsx</text>
<text x="1348" y="507" font-family="Segoe UI, Arial, sans-serif" fill="#82d5c0" font-size="13" text-anchor="end">ILLUSTRATIVE PROCESS</text></svg>